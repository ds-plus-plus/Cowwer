[package]
name = "cowwer"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.16.1" }
bevy_common_assets = { version = "0.13.0", features = ["json"] }
bevy_rapier2d = "0.30.0"
serde = { version = "1.0.219", features = ["derive"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"

[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
